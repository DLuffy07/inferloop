worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logs d'accès JSON avec temps upstream (debug de latence)
    log_format json escape=json '{'
        '"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    # DNS interne Docker, réévalué toutes les 10 s :
    # suit l'IP de l'API après un restart et les réplicas créés par --scale.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting : 100 requêtes/minute par IP, rafale de 20 tolérée, puis HTTP 429
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=100r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    client_max_body_size 64k;   # un article fait < 5 000 caractères

    upstream inferloop_api {
        zone inferloop_api 64k;
        # "resolve" (nginx >= 1.27.3) : round-robin sur tous les réplicas "api"
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --- Point d'entrée public (port 80) : rate-limité ------------------------
    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_pass http://inferloop_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # Si un réplica tombe, on retente sur un autre
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }

    # --- Listener interne (8080, NON publié sur l'hôte) : tests de charge -----
    # Même upstream, sans rate limit. Joignable uniquement depuis le réseau Docker.
    server {
        listen 8080;

        location / {
            proxy_pass http://inferloop_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # Si un réplica tombe, on retente sur un autre
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
