events {}

http {
    limit_req_zone $binary_remote_addr zone=inferloop_limit:10m rate=100r/m;

    upstream inferloop_api {
        server api:8000;
    }

    server {
        listen 80;

        location / {
            limit_req zone=inferloop_limit burst=20 nodelay;

            proxy_pass http://inferloop_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}