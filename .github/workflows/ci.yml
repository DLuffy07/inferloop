name: InferLoop CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_MAX_BYTES: "2000000000"   # contrainte : image API < 2 Go

jobs:
  # 1) Qualité : lint + tests (modèle mocké -> pas besoin de torch, ~30 s)
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest + couverture
        run: pytest --cov=api --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest-report.xml

  # 2) Validation des configs d'infra (compose, nginx, prometheus)
  config:
    name: Validate stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml config --quiet

      - name: nginx -t
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27.5-alpine nginx -t

      - name: promtool check config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus:/cfg:ro" \
            prom/prometheus:v2.55.1 check config /cfg/prometheus.yml

      - name: Grafana dashboard JSON valide
        run: python -m json.tool monitoring/grafana/dashboards/inferloop.json > /dev/null

  # 3) Build de l'image (après les tests : inutile de builder du code cassé),
  #    contrôle de taille, puis push GHCR uniquement sur main.
  docker:
    name: Build & Push image
    runs-on: ubuntu-latest
    needs: [test, config]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom d'image en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build (chargée localement pour contrôle)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Contrôle taille image < 2 Go
        run: |
          SIZE=$(docker image inspect "$IMAGE:${{ github.sha }}" --format '{{.Size}}')
          echo "Taille image : $((SIZE / 1024 / 1024)) Mo"
          echo "### Image API : $((SIZE / 1024 / 1024)) Mo (limite 2000 Mo)" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -lt "$IMAGE_MAX_BYTES"

      - name: Smoke test du conteneur (sans modèle)
        run: |
          docker run -d --name smoke -e LOAD_MODEL=0 -p 8000:8000 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do curl -fs localhost:8000/metrics > /dev/null && break; sleep 1; done
          curl -fs localhost:8000/metrics | grep -q inferloop_http_requests_total
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health)" = "503"
          docker rm -f smoke

      - name: Login GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push GHCR (sha + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
